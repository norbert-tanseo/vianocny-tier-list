name = "vianocny-tier-list"
compatibility_date = "2026-11-19"

# Cloudflare Pages Git integration serves the static build from dist/.
# Create a D1 database in the Cloudflare dashboard and add its database_id here,
# or configure the same binding under Pages → Settings → Functions → D1 bindings.
[[d1_databases]]
binding = "DB"
database_name = "vianocny-tier-list"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
