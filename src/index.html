<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13251e" />
    <meta name="description" content="Vianočný tier list filmov a rozprávok." />
    <title>Vianočný tier list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top" aria-label="Vianočný tier list">
        <span class="brand-mark">✦</span>
        <span>Vianočný <strong>tier list</strong></span>
      </a>
      <a class="community-link" href="#prehlad">Top 3</a>
    </header>

    <main id="top" class="page">
      <section class="intro">
        <div>
          <p class="eyebrow">Vianočný tier list</p>
          <h1>Zoraď svoje <em>vianočné klasiky.</em></h1>
        </div>
        <p class="intro-note">Vyber kategóriu a zoraď filmy.</p>
      </section>

      <section class="category-switcher" aria-label="Kategórie filmov">
        <div class="category-tabs" id="categoryTabs"></div>
      </section>

      <section class="preview-section" id="prehlad">
        <div class="section-topline">
          <div>
            <span class="section-label">Prehľad</span>
            <h2>Top 3 v každej kategórii</h2>
          </div>
          <span class="vote-total" id="voteTotal">0 hlasov</span>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </section>

      <section class="builder-section" id="zoraď">
        <div class="section-topline builder-topline">
          <div>
            <span class="section-label">Tvoj výber</span>
            <h2 id="activeCategoryTitle">Animáky</h2>
          </div>
          <button class="reset-button" id="resetBoard" type="button">Resetovať</button>
        </div>

        <div class="board" id="board" aria-label="Aktívny tier list">
          <div class="tier-row tier-s" data-tier="S"><div class="tier-label"><b>S</b></div><div class="tier-dropzone" data-tier="S" aria-label="Tier S"></div></div>
          <div class="tier-row tier-a" data-tier="A"><div class="tier-label"><b>A</b></div><div class="tier-dropzone" data-tier="A" aria-label="Tier A"></div></div>
          <div class="tier-row tier-b" data-tier="B"><div class="tier-label"><b>B</b></div><div class="tier-dropzone" data-tier="B" aria-label="Tier B"></div></div>
          <div class="tier-row tier-c" data-tier="C"><div class="tier-label"><b>C</b></div><div class="tier-dropzone" data-tier="C" aria-label="Tier C"></div></div>
          <div class="tier-row tier-d" data-tier="D"><div class="tier-label"><b>D</b></div><div class="tier-dropzone" data-tier="D" aria-label="Tier D"></div></div>
        </div>

        <div class="library-bar">
          <h3>Filmy</h3>
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Hľadať" autocomplete="off" /></label>
        </div>
        <div class="film-library" id="filmLibrary" aria-label="Filmy na zaradenie"></div>
        <p class="empty-library" id="emptyLibrary" hidden>Nič sa nenašlo.</p>

        <div class="submit-row">
          <span id="selectionHint">Zoraď všetky filmy v kategórii</span>
          <button class="primary-button" id="submitButton" type="button">Uložiť tierlist</button>
        </div>
        <div class="save-result" id="saveResult" hidden role="status" aria-live="polite">
          <span class="save-result-mark" aria-hidden="true">✓</span>
          <div>
            <strong>Tierlist je uložený</strong>
            <span id="saveResultText"></span>
          </div>
          <button class="save-result-action" id="saveResultReset" type="button">Zoradiť znova</button>
        </div>
      </section>
    </main>

    <dialog class="name-dialog" id="nameDialog">
      <form method="dialog" id="nameForm">
        <button class="dialog-close" value="cancel" aria-label="Zavrieť">×</button>
        <span class="section-label">Uložiť tierlist</span>
        <h2>Tvoje meno</h2>
        <input id="nameInput" name="name" maxlength="40" required placeholder="Meno alebo prezývka" autocomplete="nickname" />
        <button class="primary-button dialog-submit" value="submit" type="submit">Odoslať</button>
        <p class="dialog-status" id="dialogStatus" role="status"></p>
      </form>
    </dialog>

    <script src="./app.js" type="module"></script>
  </body>
</html>
